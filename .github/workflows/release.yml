name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack
        run: |
          npm pack
          cp cardea-cli-*.tgz cardea-cli.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" cardea-cli.tgz cardea-cli-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" cardea-cli.tgz cardea-cli-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
          fi
